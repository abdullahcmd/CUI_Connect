# One-command demo on a lab machine:  docker compose up --build   (API on :4000, then run `docker compose exec api npm run seed`)
services:
  mongo:
    image: mongo:7
    volumes: [mongo-data:/data/db]
    ports: ["27017:27017"]
  redis:
    image: redis:7
    ports: ["6379:6379"]
  api:
    build: ./server
    environment:
      MONGO_URL: mongodb://mongo:27017/cui_connect
      REDIS_URL: redis://redis:6379
      JWT_SECRET: change-me-in-real-deployments
      CLIENT_URL: https://localhost
      NODE_ENV: production
      BEHIND_TLS_PROXY: "true"   # nginx terminates HTTPS
      MESSAGE_KEY: ${MESSAGE_KEY:?set MESSAGE_KEY (run: npm run keygen in server/)}
    depends_on: [mongo, redis]
    expose: ["4000"]
    volumes: [uploads:/app/uploads]
  nginx:
    image: nginx:1.27
    depends_on: [api]
    ports: ["80:80", "443:443"]
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certs:/etc/nginx/certs:ro
      - ./client/dist:/usr/share/nginx/html:ro
volumes:
  mongo-data:
  uploads:
